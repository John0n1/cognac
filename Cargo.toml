[package]
name = "cognac"
version = "0.1.0"
edition = "2024"
description = "An intelligent Windows application installer for Linux"
license = "MIT"
authors = ["John Hauger Mitander <john@mitander.io>"]
repository = "https://github.com/John0n1/cognac"
homepage = "https://github.com/John0n1/cognac"
readme = "README.md"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
goblin = "0.10"
hex = "0.4"
memmap2 = "0.9"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = "thin"
strip = true

[package.metadata.generate-rpm]
release = "1"
assets = [
    { source = "target/release/cognac", dest = "/usr/bin/cognac", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/cognac/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/cognac/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
coreutils = "*"
tar = "*"
xz = "*"
python3 = ">= 3.10"
